<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afaire</title>
<meta name="description" content="Plan your day, look after yourself.">
<meta name="theme-color" content="#070C09">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Afaire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Anuphan:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#F3EEE6;--deep:#0B130F;--muted:rgba(243,238,230,.62);--lime:#DDF247;--line:rgba(255,255,255,.12);
  --ivory:radial-gradient(80% 40% at 50% 0%, #FFFDF9 0%, rgba(255,253,249,0) 70%), radial-gradient(70% 35% at 100% 100%, rgba(240,214,196,.45) 0%, rgba(240,214,196,0) 70%), #F4EFE8;
  --ivoryb:radial-gradient(42% 22% at 92% 16%, rgba(255,170,200,.6) 0%, rgba(255,170,200,0) 70%), radial-gradient(48% 24% at 2% 52%, rgba(150,225,205,.55) 0%, rgba(150,225,205,0) 70%), radial-gradient(48% 24% at 85% 90%, rgba(190,175,255,.5) 0%, rgba(190,175,255,0) 70%), radial-gradient(80% 40% at 50% 0%, #FFFDF9 0%, rgba(255,253,249,0) 70%), radial-gradient(70% 35% at 100% 100%, rgba(240,214,196,.45) 0%, rgba(240,214,196,0) 70%), #F4EFE8;
  --font:Outfit,Anuphan,'IBM Plex Sans Thai',system-ui,sans-serif;--tabH:56px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#070C09;overflow-x:hidden}
body{margin:0;min-height:100dvh;overflow-x:hidden;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.4;background:var(--ivory);background-attachment:fixed;transition:background .6s;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body.b{background:var(--ivoryb);background-attachment:fixed}
body.c{color:#fff;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{font-size:16px}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 120px) max(20px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.top h1{margin:0;flex:1;white-space:nowrap;font-weight:300;font-size:32px;line-height:1;letter-spacing:-.01em}
.top h1 small{font-size:18px;color:var(--muted)}
body.c .top h1 small{color:rgba(255,255,255,.8)}
.sub{font-size:13px;font-weight:300;color:var(--muted);margin-top:4px}
body.c .sub{color:rgba(255,255,255,.9)}
.label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:300;color:var(--muted);margin:18px 8px 8px}
body.c .label{color:rgba(255,255,255,.9)}
.muted{color:var(--muted)}
.mt{margin-top:12px}.mt16{margin-top:16px}

/* ripple */
.rp{position:relative;overflow:hidden}
.rp::after{content:"";position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.7) 0%,rgba(221,242,71,.25) 30%,rgba(255,255,255,0) 62%);transform:translate(-50%,-50%) scale(1);opacity:0;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity 1s;pointer-events:none}
.rp:active::after{transform:translate(-50%,-50%) scale(0);opacity:1;transition:0s}

/* surfaces */
.glass{border-radius:30px;border:1.5px solid transparent;background:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.38)) padding-box,conic-gradient(from 210deg,rgba(255,255,255,.95),rgba(255,196,224,.85),rgba(196,222,255,.85),rgba(214,255,224,.85),rgba(255,255,255,.95)) border-box;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 12px 30px rgba(120,100,80,.12),inset 0 1px 0 rgba(255,255,255,.9);color:var(--ink)}
body.c .glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);box-shadow:none;color:#fff}
.aura{position:relative;isolation:isolate;border-radius:30px;color:#fff;text-shadow:0 1px 3px rgba(40,30,60,.32),0 0 14px rgba(40,30,60,.22)}
.aura::before{content:"";position:absolute;inset:3px;border-radius:inherit;background:var(--a);filter:blur(9px) saturate(1.15);z-index:-1;transition:filter .4s}
.aura:active::before{filter:blur(18px) saturate(1.3)}
.a-violet{--a:radial-gradient(70% 80% at 25% 15%, #F1D9FF 0%, rgba(241,217,255,0) 60%), radial-gradient(80% 90% at 85% 95%, #8C78EA 0%, rgba(140,120,234,0) 65%), linear-gradient(160deg,#C2ACF3 0%,#9F8AE3 100%)}
.a-teal{--a:radial-gradient(60% 60% at 70% 85%, #8BF0B0 0%, rgba(139,240,176,0) 60%), radial-gradient(70% 70% at 20% 10%, #6FA8B8 0%, rgba(111,168,184,0) 60%), linear-gradient(160deg,#3F807A 0%,#28534F 100%)}
.a-coral{--a:radial-gradient(60% 60% at 15% 15%, #FF9A62 0%, rgba(255,154,98,0) 60%), radial-gradient(70% 70% at 95% 95%, #F07ADF 0%, rgba(240,122,223,0) 62%), linear-gradient(160deg,#F09AB4 0%,#DC6FA6 100%)}
.a-gold{--a:radial-gradient(60% 70% at 85% 15%, #FFE683 0%, rgba(255,230,131,0) 60%), radial-gradient(70% 70% at 5% 100%, #FF9C6A 0%, rgba(255,156,106,0) 62%), linear-gradient(160deg,#F5AE6E 0%,#E2804E 100%)}
.a-sky{--a:radial-gradient(60% 70% at 20% 20%, #CDEFFF 0%, rgba(205,239,255,0) 60%), radial-gradient(70% 70% at 95% 95%, #6E8CF2 0%, rgba(110,140,242,0) 62%), linear-gradient(160deg,#86B4EC 0%,#5E7FDA 100%)}
.a-night{--a:radial-gradient(60% 70% at 85% 15%, #A3ABFF 0%, rgba(163,171,255,0) 60%), radial-gradient(60% 60% at 10% 95%, #B07BE0 0%, rgba(176,123,224,0) 60%), linear-gradient(160deg,#4B5190 0%,#2D305F 100%)}
body.c.m-calm{background:radial-gradient(90% 45% at 50% 0%, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 70%), radial-gradient(60% 40% at 85% 10%, rgba(150,230,240,.85) 0%, rgba(150,230,240,0) 70%), radial-gradient(55% 45% at 5% 35%, rgba(120,135,235,.7) 0%, rgba(120,135,235,0) 70%), radial-gradient(70% 40% at 80% 75%, rgba(140,235,200,.55) 0%, rgba(140,235,200,0) 70%), radial-gradient(60% 35% at 15% 100%, rgba(90,110,210,.6) 0%, rgba(90,110,210,0) 70%), linear-gradient(165deg,#93C1D3 0%,#7BA0C4 55%,#6A84B5 100%);background-attachment:fixed}
body.c.m-happy{background:radial-gradient(90% 45% at 50% 0%, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 70%), radial-gradient(60% 40% at 85% 8%, rgba(255,215,120,.9) 0%, rgba(255,215,120,0) 70%), radial-gradient(55% 45% at 0% 40%, rgba(255,140,105,.7) 0%, rgba(255,140,105,0) 70%), radial-gradient(70% 40% at 85% 78%, rgba(235,115,150,.55) 0%, rgba(235,115,150,0) 70%), radial-gradient(60% 35% at 15% 100%, rgba(255,180,90,.6) 0%, rgba(255,180,90,0) 70%), linear-gradient(165deg,#E2B98C 0%,#CF967C 55%,#B97F86 100%);background-attachment:fixed}
body.c.m-excited{background:radial-gradient(90% 45% at 50% 0%, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 70%), radial-gradient(60% 40% at 85% 8%, rgba(255,150,100,.9) 0%, rgba(255,150,100,0) 70%), radial-gradient(55% 45% at 0% 38%, rgba(240,80,150,.7) 0%, rgba(240,80,150,0) 70%), radial-gradient(70% 40% at 85% 78%, rgba(255,190,90,.55) 0%, rgba(255,190,90,0) 70%), radial-gradient(60% 35% at 15% 100%, rgba(170,70,190,.6) 0%, rgba(170,70,190,0) 70%), linear-gradient(165deg,#E3A196 0%,#C9839E 55%,#A07BAE 100%);background-attachment:fixed}
body.c.m-stressed{background:radial-gradient(90% 45% at 50% 0%, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 70%), radial-gradient(60% 40% at 85% 8%, rgba(215,195,255,.85) 0%, rgba(215,195,255,0) 70%), radial-gradient(55% 45% at 0% 38%, rgba(140,120,235,.7) 0%, rgba(140,120,235,0) 70%), radial-gradient(70% 40% at 85% 78%, rgba(245,180,225,.5) 0%, rgba(245,180,225,0) 70%), radial-gradient(60% 35% at 15% 100%, rgba(110,140,230,.55) 0%, rgba(110,140,230,0) 70%), linear-gradient(165deg,#B4A8D8 0%,#9A90C8 55%,#8380B5 100%);background-attachment:fixed}
body.c.m-night{background:radial-gradient(90% 45% at 50% 0%, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 70%), radial-gradient(60% 40% at 85% 8%, rgba(170,175,255,.6) 0%, rgba(170,175,255,0) 70%), radial-gradient(55% 45% at 0% 40%, rgba(190,120,230,.5) 0%, rgba(190,120,230,0) 70%), radial-gradient(70% 40% at 85% 80%, rgba(90,140,230,.5) 0%, rgba(90,140,230,0) 70%), radial-gradient(60% 35% at 10% 100%, rgba(120,90,200,.55) 0%, rgba(120,90,200,0) 70%), linear-gradient(165deg,#7F8BC0 0%,#6B6FA8 55%,#5A5A92 100%);background-attachment:fixed}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:13px;background:var(--lime);color:var(--deep);font-size:12px;font-weight:400;text-shadow:none;white-space:nowrap}
.dotA{background:var(--a)}
.chip.w{background:rgba(255,255,255,.82)}
.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.dark{background:#F3EEE6;color:var(--deep);box-shadow:0 12px 24px rgba(0,0,0,.35)}
.limebtn{background:var(--lime);color:var(--deep);box-shadow:0 10px 22px rgba(160,180,40,.3)}
.pill{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:29px;font-size:16px;font-weight:300;width:100%}
.big{display:block;font-size:26px;font-weight:200;line-height:1.05}
.big small{font-size:13px;font-weight:300;margin-left:4px}

/* grid tiles */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{height:140px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .t{display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:400}
.tile.round{border-radius:50%;width:140px;justify-self:center;align-items:center;justify-content:center;text-align:center;gap:4px;padding:0}

/* rows */
.list{padding:6px 10px}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:6px 10px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
body.c .row+.row{border-top-color:rgba(255,255,255,.25)}
.row .b{flex:1;min-width:0}
.row .t1{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.row .t2{display:block;font-size:12px;font-weight:300;color:var(--muted)}
.row.done .t1{text-decoration:line-through;color:#9A918A}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none;color:transparent;transition:.25s}
.ck svg{width:12px;height:12px;stroke-width:3}
.done .ck,.ck.on{background:var(--lime);border-color:var(--lime);color:var(--deep)}
.empty{padding:16px 10px;font-size:14px;font-weight:300;color:var(--muted)}

/* segmented */
.seg{display:flex;gap:4px;padding:5px;border-radius:30px}
.seg button{flex:1;text-align:center;height:44px;border-radius:22px;font-size:15px;font-weight:300;transition:.3s}
.seg button.on{background:#fff;font-weight:400;box-shadow:0 6px 14px rgba(120,100,80,.15),inset 0 1px 0 #fff}
body.c .seg button.on{color:#3E3A5C}

.field{display:block;margin-bottom:10px;min-width:0}
.field>span{display:block;font-size:12.5px;font-weight:300;color:var(--muted);margin:0 6px 4px}
.inp{width:100%;border:0;border-radius:18px;background:rgba(255,255,255,.7);padding:13px 16px;outline:0;min-height:50px;box-shadow:inset 0 0 0 1px rgba(43,38,35,.08);-webkit-appearance:none;appearance:none;color:var(--ink)}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
.inp{min-width:0}
.inp:focus{box-shadow:inset 0 0 0 2px var(--ink)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick{display:flex;align-items:center;gap:10px;height:58px;padding:0 7px 0 20px;border-radius:29px}
.quick input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-weight:300}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:center;align-items:center;gap:8px;z-index:20;pointer-events:none}
.nav a{pointer-events:auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.nav a.on{background:var(--lime);box-shadow:0 10px 22px rgba(160,180,40,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.nav a.add{width:84px;height:56px;border-radius:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(43,38,35,.28);z-index:40;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:41;border-radius:32px 32px 0 0;max-height:calc(100dvh - env(safe-area-inset-top) - 20px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:rgba(250,247,242,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 -10px 40px rgba(43,38,35,.18);color:var(--ink)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:rgba(43,38,35,.15);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px 22px;flex:none}
.sheet .sh h3{margin:0;font-weight:300;font-size:22px}
.sheet .sb{overflow-y:auto;padding:6px 18px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dw{text-align:center;font-size:12px;font-weight:300;color:var(--muted);padding-bottom:4px}
.cal button{height:52px;border-radius:14px;padding:6px 0 0 7px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:14px;font-weight:300;background:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);transition:.25s}
.cal button.ev{background:rgba(150,205,180,.5)}
.cal button.tk{background:rgba(240,170,180,.5)}
.cal button.today{background:var(--lime);font-weight:500}
.cal button.sel{box-shadow:0 0 0 2px var(--ink)}
.cal button.out{opacity:.35}
.cal button small{font-size:9.5px;color:var(--muted);padding-bottom:4px;min-height:12px}
.cal.sm{gap:4px}
.cal.sm button{height:40px;border-radius:13px;padding:0;align-items:center;justify-content:center;gap:0}
.cal.sm button small{padding:0;min-height:8px;line-height:8px;font-size:12px;color:var(--ink)}
.cal.sm button.sel:not(.today){background:#fff}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:11px;font-weight:300;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* pills */
.pcap{display:flex;align-items:center;gap:16px;width:100%;min-height:96px;padding:12px 22px 12px 14px;margin-bottom:8px;border-radius:48px;text-align:left}
.capw{position:relative;width:60px;height:74px;display:grid;place-items:center;flex:none}
.cap{position:relative;width:34px;height:74px;border-radius:17px;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.8),rgba(255,255,255,.28) 45%,rgba(255,255,255,.62));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95),inset 0 -6px 10px rgba(120,100,140,.12),0 10px 20px rgba(120,100,80,.18)}
.cap .half{position:absolute;left:0;right:0;top:0;height:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0%,var(--c1) 35%,var(--c2) 100%);box-shadow:inset 0 -3px 6px rgba(0,0,0,.12)}
.cap .liq{position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(180deg,var(--c1),var(--c2));opacity:0;transition:opacity .25s}
.cap .seam{position:absolute;left:0;right:0;top:50%;height:1.5px;background:rgba(255,255,255,.95)}
.cap .shine{position:absolute;left:6px;top:8px;width:6px;height:44px;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.capw .badge{position:absolute;right:0;bottom:4px;width:24px;height:24px;border-radius:50%;background:var(--lime);display:grid;place-items:center;box-shadow:0 4px 10px rgba(160,180,40,.4);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1) .12s}
.capw .badge svg{width:12px;height:12px;stroke-width:3.2}
.on .cap .liq{opacity:.65}.on .capw .badge{transform:scale(1)}
.on .cap{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95),0 10px 24px var(--c2)}
.cap.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14) translateY(-3px)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cap.pop{animation:none}}

/* breathe */
.orbwrap{height:290px;display:grid;place-items:center;position:relative;margin-top:6px}
.orbwrap .r1,.orbwrap .r2{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.orbwrap .r1{width:250px;height:250px}.orbwrap .r2{width:180px;height:180px;border-style:dashed}
.orb{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.8) 0%,rgba(235,228,255,.45) 38%,rgba(235,228,255,0) 70%);box-shadow:0 0 60px rgba(255,255,255,.35);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform:scale(.62)}
@keyframes oSigh{0%{transform:scale(.62)}22%{transform:scale(.9)}33%{transform:scale(1)}100%{transform:scale(.62)}}
@keyframes oBox{0%{transform:scale(.62)}25%{transform:scale(1)}50%{transform:scale(1)}75%{transform:scale(.62)}100%{transform:scale(.62)}}
@keyframes oSlow{0%{transform:scale(.62)}50%{transform:scale(1)}100%{transform:scale(.62)}}
.phase{height:40px;margin-top:4px;text-align:center;font-size:28px;font-weight:300}
@media (prefers-reduced-motion:reduce){.orb{animation:none!important}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(16px);background:#F3EEE6;color:var(--deep);padding:11px 18px;border-radius:18px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.flip{display:block;width:100%;height:124px;perspective:900px;border-radius:30px}
.flip>span{position:absolute;inset:0;display:flex;padding:0 22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.fr{align-items:center;gap:16px}
.bk{flex-direction:column;justify-content:center;transform:rotateY(-180deg)}
.flip.on .fr{transform:rotateY(180deg)}.flip.on .bk{transform:rotateY(0)}
.card-ic{width:62px;height:84px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.15));box-shadow:inset 0 1px 0 #fff;display:grid;place-items:center;flex:none}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:6px;background:#fff}
/* forest theme (whole app) */
:root{color-scheme:dark}
body,body.b{background:radial-gradient(70% 35% at 100% 0%,rgba(120,160,130,.14) 0%,rgba(120,160,130,0) 70%),radial-gradient(80% 45% at 0% 100%,rgba(40,80,55,.35) 0%,rgba(40,80,55,0) 70%),#070C09;background-attachment:fixed}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 16px 30px rgba(0,0,0,.25);color:var(--ink)}
.nav a.on{color:var(--deep)}
.nav a.glass{background:rgba(255,255,255,.08);box-shadow:none}
.ck{border-color:rgba(255,255,255,.75)}
.row.done .t1{color:rgba(255,255,255,.4)}
.inp{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:var(--ink)}
.inp::placeholder,textarea::placeholder,input::placeholder{color:rgba(243,238,230,.4)}
.inp:focus{box-shadow:inset 0 0 0 2px rgba(243,238,230,.8)}
select.inp option{background:#121A15;color:#F3EEE6}
.sheet{background:rgba(16,24,19,.97);box-shadow:0 -10px 40px rgba(0,0,0,.5);color:var(--ink);border-top:1px solid rgba(255,255,255,.1)}
.cal button.sel{box-shadow:0 0 0 2px #F3EEE6}
.seg button.on{background:#F3F1EA;color:var(--deep);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.cal button{background:rgba(255,255,255,.07)}
.cal button.ev{background:rgba(143,179,157,.45)}
.cal button.tk{background:rgba(200,110,120,.45)}
.cal button.today{background:var(--lime);color:var(--deep)}
.cal button.today small{color:var(--deep)}
.cal.sm button.sel:not(.today){background:#F3F1EA;color:var(--deep)}
/* forest home */
body.f .nav a.on{color:#0B130F}
body.f{color:#F3EEE6;background:radial-gradient(70% 35% at 100% 0%,rgba(120,160,130,.14) 0%,rgba(120,160,130,0) 70%),radial-gradient(80% 45% at 0% 100%,rgba(40,80,55,.35) 0%,rgba(40,80,55,0) 70%),#070C09;background-attachment:fixed}
body.f .nav a.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);box-shadow:none;color:#F3EEE6}
body.f .nav a.add{background:#F3EEE6;color:#0B130F;box-shadow:0 12px 24px rgba(0,0,0,.4)}
body.f .ck{border-color:rgba(255,255,255,.75)}
body.f .row+.row{border-top-color:rgba(255,255,255,.12)}
body.f .row .t2,body.f .empty{color:rgba(243,238,230,.72)}
body.f .row.done .t1{color:rgba(255,255,255,.4)}
.wh{position:relative;overflow:hidden;border-radius:36px;border:1px solid rgba(255,255,255,.16);padding:14px;color:#fff;margin-top:6px;touch-action:pan-y;background:radial-gradient(55% 45% at 50% 58%,rgba(6,14,10,.92) 0%,rgba(6,14,10,.55) 45%,rgba(6,14,10,0) 80%),radial-gradient(40% 40% at 92% 100%,rgba(226,150,80,.55) 0%,rgba(226,150,80,0) 70%),linear-gradient(180deg,#A9C7B4 0%,#8FB39D 50%,#6E9580 100%);box-shadow:0 24px 44px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.wh .hd{display:flex;gap:10px;align-items:center}
.wh .sg{flex:1;display:flex;padding:4px;border-radius:20px;background:rgba(7,12,9,.28)}
.wh .sg button{flex:1;display:grid;place-items:center;height:40px;border-radius:17px;font-size:15px;color:rgba(255,255,255,.7);transition:.3s}
.wh .sg button.on{background:#F3F1EA;color:#0B130F;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.wh .ib{width:46px;height:46px;border-radius:50%;background:rgba(7,12,9,.28);display:grid;place-items:center;color:#fff;flex:none}
.wh .big{display:flex;gap:12px;justify-content:space-between;align-items:baseline;margin:12px 4px 0;font-size:46px;font-weight:500;line-height:1.05;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.wh .big.s{font-size:40px}
.wh .whl{position:relative;height:118px;margin:8px -14px 0}
.wh .arc{position:absolute;left:0;right:0;border-radius:50% 50% 0 0/26px 26px 0 0}
.wh .days{position:absolute;inset:0 6px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wh .days button{display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.wh .days .l{font-size:15px;font-weight:300}
.wh .days .n{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:300;transition:.35s cubic-bezier(.3,1.4,.5,1)}
.wh .days .on .n{background:#F3F1EA;color:#0B130F;font-weight:500;text-shadow:none;transform:scale(1.06);box-shadow:0 0 0 6px rgba(243,241,234,.12),0 10px 24px rgba(0,0,0,.45)}
.wh .days .td .n{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.wh .dot{width:5px;height:5px;border-radius:50%;margin-top:-8px}
.wh .dot.y{background:#fff}
.wh .mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.wh .mg.dn{margin-top:10px;text-align:center;font-size:11px}
.wh .mg button{height:40px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff}
.wh .mg button.on{background:rgba(255,255,255,.3)}
.wh .mg button span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:300;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.wh .mg button.td span{background:#F3F1EA;color:#0B130F;font-weight:500;text-shadow:none}
.wh .mg button i{width:4px;height:4px;border-radius:50%}
.wh .mg button i.y{background:#fff}
.wh .ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.wh .ft .nv{display:flex;gap:6px}
.wh .ft .nv button{width:44px;height:44px;border-radius:50%;background:rgba(7,12,9,.28);display:grid;place-items:center;color:#fff}
.wh .ft .ne{height:44px;padding:0 18px;border-radius:22px;background:#F3EEE6;color:#121A33;font-size:15px;display:flex;align-items:center;gap:8px}
.tl{border-radius:34px;border:1px solid rgba(255,255,255,.12);overflow:hidden;margin-top:12px;padding:8px 10px 6px;color:#F3EEE6;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 30px rgba(0,0,0,.3)}
.tl.todo{background:radial-gradient(70% 60% at 85% 110%,rgba(232,150,140,.85) 0%,rgba(232,150,140,0) 70%),radial-gradient(60% 50% at 10% 120%,rgba(200,110,120,.7) 0%,rgba(200,110,120,0) 70%),linear-gradient(180deg,#2A2326 0%,#6E4A50 60%,#A86E6E 100%)}
.tl.sch{background:radial-gradient(50% 70% at 88% 70%,rgba(226,150,90,.7) 0%,rgba(226,150,90,0) 70%),radial-gradient(70% 70% at 20% 120%,rgba(60,90,210,.85) 0%,rgba(60,90,210,0) 70%),linear-gradient(180deg,#121A2E 0%,#1F2E6E 100%)}
.tl .th{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 4px;font-size:17px}
.tl .th small{font-size:13px;font-weight:300;color:rgba(243,238,230,.72)}
.tl .row{border-top:1px solid rgba(255,255,255,.12)}
.tl .bar{width:4px;height:30px;border-radius:4px;flex:none}
/* rich aura tiles (ref) */
.aura::before{filter:blur(9px) saturate(.9)}
.aura:active::before{filter:blur(16px) saturate(1)}
.a-violet{--a:radial-gradient(55% 50% at 50% 62%, rgba(46,8,48,.85) 0%, rgba(46,8,48,0) 75%), linear-gradient(180deg,#C06FA9 0%,#844486 55%,#53265A 100%)}
.a-teal{--a:radial-gradient(50% 50% at 58% 58%, rgba(5,9,7,.95) 0%, rgba(5,9,7,0) 78%), linear-gradient(160deg,#A3BFAF 0%,#7F9C8C 100%)}
.a-coral{--a:radial-gradient(42% 38% at 62% 52%, rgba(125,35,85,.85) 0%, rgba(125,35,85,0) 75%), linear-gradient(160deg,#E2B0CE 0%,#C98DB2 100%)}
.a-gold{--a:radial-gradient(34% 40% at 72% 58%, #4A58BE 0%, rgba(74,88,190,0) 75%), linear-gradient(160deg,#C2724F 0%,#A65839 100%)}
.a-sky{--a:radial-gradient(48% 50% at 55% 58%, rgba(6,9,26,.92) 0%, rgba(6,9,26,0) 78%), linear-gradient(160deg,#4C64C2 0%,#34448F 100%)}
.a-night{--a:linear-gradient(180deg,#4B4458 0%,#896873 55%,#C4877C 100%)}
.aura{text-shadow:0 1px 3px rgba(0,0,0,.35)}
.tl.todo{background:linear-gradient(180deg,#4B4458 0%,#896873 55%,#C4877C 100%)}
.tl.sch{background:radial-gradient(48% 55% at 55% 60%,rgba(6,9,26,.9) 0%,rgba(6,9,26,0) 78%),linear-gradient(160deg,#4C64C2 0%,#34448F 100%)}
</style>
</head>
